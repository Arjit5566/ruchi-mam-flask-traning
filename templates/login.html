{% extends "base.html" %}

{% block title %}Login - Library Management System{% endblock %}

{% block content %}
<div class="glass-card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fa-solid fa-right-to-bracket" style="font-size: 2.5rem; color: var(--secondary);"></i>
        <h2 style="font-size: 1.8rem; font-weight: 700; margin-top: 0.5rem;">User Login</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in with your library credentials</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="username"><i class="fa-solid fa-at"></i> Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="submit-btn" style="margin-top: 1rem;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login Now
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--secondary); font-weight: 600; text-decoration: none;">Sign Up here</a>
    </div>
</div>
{% endblock %}
