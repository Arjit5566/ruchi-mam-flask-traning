{% extends "base.html" %}

{% block title %}Sign Up - Library Management System{% endblock %}

{% block content %}
<div class="glass-card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fa-solid fa-user-plus" style="font-size: 2.5rem; color: var(--primary);"></i>
        <h2 style="font-size: 1.8rem; font-weight: 700; margin-top: 0.5rem;">Create Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign up to manage library records</p>
    </div>

    <form action="{{ url_for('signup') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="name"><i class="fa-solid fa-user"></i> Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="username"><i class="fa-solid fa-at"></i> Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
        </div>

        <button type="submit" class="submit-btn" style="margin-top: 1rem;">
            <i class="fa-solid fa-user-check"></i> Complete Sign Up
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Login here</a>
    </div>
</div>
{% endblock %}
