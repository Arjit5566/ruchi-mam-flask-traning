<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body style="background-color: #f4f4f4; font-family: Arial, sans-serif;">
    <div style="max-width: 500px; margin: 50px auto; padding: 20px; border: 2px solid #ccc; border-radius: 10px; background: white;">
        <h2>Calculator</h2>
        <form method="post" action="{{ url_for('calculator') }}">
            <div style="margin-bottom: 10px;">
                <label>Number 1:</label><br>
                <input type="number" name="num1" value="{{ num1 if num1 is not none else '' }}" required>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Number 2:</label><br>
                <input type="number" name="num2" value="{{ num2 if num2 is not none else '' }}" required>
            </div>

            <div style="display: flex; gap: 10px; margin: 20px 0;">
                <button type="submit" name="operation" value="+">+</button>
                <button type="submit" name="operation" value="-">-</button>
                <button type="submit" name="operation" value="*">*</button>
                <button type="submit" name="operation" value="/">/</button>
            </div>
        </form>

        {% if result is not none %}
            <h3>Result: {{ result }}</h3>
        {% endif %}
    </div>
</body>
</html>
